name: Deploy to GitHub Pages

# Publishes the static export to GitHub Pages, which is what the "Launch the
# app" link in README.md points at.
#
# Requires Settings → Pages → Source: GitHub Actions to have been enabled once.
# Every merge to main then publishes; the manual trigger stays available for
# re-running a deploy without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# No workflow-level permissions — each job requests only what it needs, so the
# build job (which runs untrusted transitive install scripts via `npm ci`)
# never holds a token that can write Pages or mint an OIDC identity.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't persist the GITHUB_TOKEN in .git/config where dependency
          # install scripts could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A Pages *project* site is served from /<repo>/, not the domain root.
      # Without this the exported HTML requests /_next/... at the root, every
      # asset 404s, and the deploy succeeds while serving a blank page.
      # Delete this line if the site ever moves to a custom domain or a
      # <user>.github.io root repository.
      - run: npm run build
        env:
          KEYMAKER_BASE_PATH: /Keymaker-v2
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
