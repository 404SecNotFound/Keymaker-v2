name: CI

# Build + typecheck + the KEYM v1 regression suite.
#
# This is deliberately separate from crypto-regression.yml. That workflow
# gates the frozen IBTZ core and runs with no `npm ci` at all, so no
# untrusted install script can ever execute in the job that guards
# decryption of users' existing files. This one needs the dependency tree
# (hash-wasm, @noble/ciphers, esbuild, next), so it is kept apart.

# On main this no longer runs on `push`. deploy.yml calls it via
# `workflow_call` as a prerequisite of build/sign/deploy (R01), so a merge to
# main verifies before it publishes rather than beside it. Running it here on
# push as well would test the same commit twice. PRs still run it directly, so
# a branch-protection required check has a run to gate on.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  # A zero-egress tool should not phone home from its own build either.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave GITHUB_TOKEN in .git/config where a dependency
          # install script could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The denominator of the passphrase generator's entropy claim. A dropped
      # or duplicated entry would make every bit count the UI prints an
      # overstatement, and nothing else in the suite would notice.
      - name: EFF wordlist integrity
        run: npm run test:wordlist

      # The advisory password floor (KM-02c). It is UI-only, so nothing else
      # exercises it; this asserts it accepts strong lowercase secrets and
      # refuses short, low-variety and known-weak ones.
      - name: Password policy floor
        run: npm run test:password-policy

      # §7.3 KMPART2 diagnosis on the TypeScript side (corrupt part named,
      # truncated tail caught, mixed set refused). The byte-parity with the
      # Python reference is in the conformance job; this is the negative-control
      # half the parity gate does not cover.
      - name: Recovery envelope diagnosis
        run: npm run test:recovery-envelopes

      # R03: passkey enrolment binds its second WebAuthn tap to the credential it
      # just created, so a device holding several Keymaker passkeys cannot key a
      # backup to the wrong one. The browser suite's virtual authenticator holds
      # one credential and always consents, so it cannot reach this; this drives
      # webauthn-prf.ts with a mocked navigator.credentials where create() and
      # get() can disagree, and the control bites when the binding is removed.
      - name: Passkey enrolment binds to the created credential
        run: npm run test:passkey-binding

      # The page's key-file buffer is erased after an encrypt-via-worker that
      # enrols a share or passkey slot — the one path where the key file is
      # structured-cloned rather than transferred, so the page's copy is not
      # detached and has to be zeroed by hand. The key-file ArrayBuffer is
      # internal to the client call, so the browser suite cannot see it; this
      # drives crypto-client.ts with a stubbed Worker and the control bites when
      # the erase is removed.
      - name: Owned secret buffers are zeroed on every path
        run: npm run test:secret-erase

      # §7: the armor dearmor strips ASCII whitespace only, matching keym2.py's
      # bytes.split(). A non-ASCII space (U+00A0, a BOM) inside the body is kept
      # and rejected, so a container that opens in the browser is not one the
      # durable Python decryptor refuses. The control bites when the strip goes
      # back to the Unicode-aware \s. The embedded reader's half is covered by
      # tests/browser/self-extract.spec.ts.
      - name: Dearmor strips ASCII whitespace only (keym2.py parity)
        run: npm run test:dearmor-whitespace

      # parseWavToPcm16 walks the RIFF chunks and its loop guard only proves the
      # 8-byte chunk header is present, not the fmt body. A truncated fmt chunk
      # made DataView throw a raw RangeError, which is not an AudioStegoError, so
      # the UI could not tell a bad audio file from a wrong password. The control
      # bites (a RangeError leaks) when the fmt bounds check is removed.
      - name: WAV fmt chunk bounds are a typed carrier error (not a RangeError)
        run: npm run test:audio-wav-bounds

      # docs/screenshots/ is one set at one width (docs/design/DESIGN-SYSTEM.md
      # § Screenshots). It reads the committed PNG headers, so it needs
      # neither a build nor a browser and belongs in this cheap job. Nothing
      # caught the drift for months because nothing looked: two shots were
      # element captures at their own width while the rest were full bands.
      - name: Screenshots are all one width
        run: npm run test:screenshots

      # The release notes are generated from docs/VERIFYING.md so that one copy
      # of the verification commands exists rather than two. This is what keeps
      # them from drifting, and it runs on every PR rather than only at release
      # time — because a PR is when the document gets edited, and a release is
      # too late to find out.
      - name: Release notes still track docs/VERIFYING.md
        run: npm run test:release-notes

      # A release is built with one more variable than a deployment, and that
      # variable is compiled into a content-hashed chunk. The rebuild recipe in
      # docs/VERIFYING.md has to set exactly what release.yml sets, or a
      # verifier following it gets six differing files and is told to treat
      # that as tampering. This reads both and refuses to let them drift.
      - name: The release rebuild recipe still matches release.yml
        run: npm run test:release-recipe

      # R01: deploy.yml and release.yml must not build, sign or publish bytes
      # the suites have not passed. This asserts the `needs` edges that make the
      # publish jobs wait for every verification workflow, and the
      # `workflow_call` triggers that let them be waited on. A deleted edge
      # turns a deploy green while testing nothing; this catches that in the PR
      # that deletes it. This job is itself one of the gated suites, so the gate
      # guards its own wiring.
      - name: Publication is gated on the test suites
        run: npm run test:release-gate

      - name: KEYM v1 regression suite
        run: npm run test:keymaker

      - name: KEYM version dispatch
        run: npm run test:keym2-dispatch

      # The Argon2id calibration solver, against synthetic devices. Pure, so it
      # belongs here rather than in the browser job — and so a runner ten times
      # slower than a laptop measures the same fixtures and reaches the same
      # answers.
      - name: KDF calibration solver
        run: npm run test:calibration

      # parseKeym() consumes fully attacker-controlled binary before any of it
      # has been authenticated. Seeded and deterministic, so a CI failure
      # reproduces exactly.
      - name: Parser fuzzing
        run: npm run test:fuzz

      # The v2 surfaces the job above does not reach. `decryptData` dispatches
      # on the version byte, so v1's random blobs do land in the v2 parser, but
      # only as noise: nothing there deforms a real multi-slot container, and
      # nothing touches the inputs that arrive as *text* — armor, Shamir shares
      # and the self-extracting page — or `slot_count`, the one header field
      # §5.3 deliberately leaves outside every AAD.
      #
      # ~4 min. It runs here rather than as its own job because `ci` finishes
      # well inside the browser matrix either way, so this costs no wall clock
      # on the critical path and one less job to keep configured.
      - name: KEYM v2 fuzzing
        run: npm run test:fuzz2

      # v3 is what the app writes, and the job above cannot reach it: that
      # harness is pinned to v2 on purpose, with v2's offsets mirrored rather
      # than imported, so pointing it at a v3 container makes it read the
      # header as a slot table. This one carries v3's offsets and asserts the
      # property the revision exists for — every byte of the covered region
      # mutated, and any container that still opens must report the table as
      # not authentic.
      #
      # ~2 min, same reasoning as above for why it is a step and not a job.
      - name: KEYM v3 slot-table fuzzing
        run: npm run test:fuzz3

      # The Shamir field arithmetic under a hostile caller. Separate from the
      # parity gate because parity cannot see this class of defect: the index
      # guard compared the caller's number while the arithmetic reduced modulo
      # 256, and both implementations produced the same clean wrong answer from
      # the same invalid index — agreement, with neither side right. Seconds.
      - name: Shamir core, adversarially
        run: npm run test:shamir

      - name: Production build (static export + CSP hashes)
        run: npm run build

      # The mirroring recipe in docs/VERIFYING.md, executed against the build
      # just produced. It was `wget -r` and it did not work: a crawler cannot
      # reach files nothing links to, and 23 of 58 manifest entries are in that
      # category, so the documented procedure reported a third of an honest
      # deployment as FAILED. Needs `out/`, so it runs after the build.
      - name: The documented verification recipe still works
        run: npm run test:verify-recipe

      # Reading the composited page needs a real renderer, which this job
      # otherwise has no use for — every other step here is pure Node. Chromium
      # alone: the audit asks what colour was painted, and that answer does not
      # vary by engine, so the three-engine matrix in browser.yml would buy
      # nothing here and cost two more downloads.
      #
      # It stays here rather than joining the job that already has browsers.
      # browser.yml builds with KEYMAKER_BASE_PATH set, so every asset is
      # referenced at /Keymaker-v2/…, while the audit spawns static-server.mjs
      # with no base path at all — the stylesheet would 404 and the audit would
      # be grading unstyled HTML. (It fails loudly rather than passing when
      # that happens: the browser's own defaults paint link blue and grey form
      # borders, all four of which are off-system. Verified by deleting the
      # stylesheet from out/ and re-running.) This job is where the
      # root-relative build already exists.
      - name: Install the browser the palette audit renders in
        run: npx playwright install --with-deps chromium

      # Every painted colour in the built app, held to the palette in
      # docs/design/DESIGN-SYSTEM.md. Reads the rendered page rather than the
      # source, because the defect this catches — a wash or an inherited
      # colour resolving to something off-system — is invisible in a class
      # name and only exists once the browser has composited it. Needs
      # `out/`, so it runs after the build alongside the recipe check.
      - name: Every colour is one the design system names
        run: npm run test:palette

      # The same idea for § Icons: three sizes, one stroke. It reads the
      # rendered box rather than the JSX because the button base's
      # `[&_svg]:size-4` outranks the `h-*` on the icon itself, so the source
      # says one number and the browser paints another. Reuses the chromium
      # installed for the palette gate.
      - name: Every icon is a size the design system names
        run: npm run test:icons

  # Two clean builds of the same commit must produce identical bytes.
  #
  # This is what makes the signed manifest mean something a user can act on.
  # A signature alone proves "CI built this"; reproducibility is what lets
  # someone check that what CI built matches the source they read. It is also
  # unusually easy to lose by accident — one timestamp or random id baked into
  # a bundle and it is gone, with nothing else failing.
  #
  # Its own job because it runs the full build twice, and there is no reason
  # for that to serialise behind the test suite.
  # Once per channel. The release label is compiled in (next.config.js reads
  # KEYMAKER_RELEASE_TAG), so a release is a different build from a deployment
  # of the same commit, and determinism proven on one channel says nothing
  # about the other. The release leg sets the tag the way release.yml does,
  # derived from package.json rather than typed here, so it cannot disagree
  # with the version the label check compares against.
  reproducible:
    strategy:
      fail-fast: false
      matrix:
        channel: [development, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Label this leg as the tagged release
        if: matrix.channel == 'release'
        run: |
          echo "KEYMAKER_RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build twice and compare every byte
        run: npm run verify:reproducible
        env:
          KEYMAKER_BASE_PATH: /Keymaker-v2

  # Does a *different machine* reproduce the published bytes?
  #
  # The job above builds twice on one runner. That answers "is the build a
  # function of its source" and catches the `Date.now()` class immediately, but
  # it is not the question anyone verifying a deployment is asking. They are
  # asking whether *their* machine produces what was published, and every
  # variable their machine would change — the OS image, the CPU, the Node
  # version, the absolute path of the checkout — is held fixed by running both
  # builds in the same container.
  #
  # Each leg here is a separate runner, so "a different machine" is free. The
  # two things varied on purpose are the ones a verifier is most likely to
  # differ in:
  #
  #  - **the checkout path**, because an absolute path that leaks into a bundle
  #    or a source map is the classic way a build stops being portable, and it
  #    is invisible to anyone who only ever builds in one directory;
  #  - **the Node major**, because README.md tells people 22.22.2 *or newer* is
  #    supported, and a verifier on a newer major who gets different bytes has
  #    been told to expect a match.
  #
  # Not varied: OS and CPU architecture. Both cost real runner time, and neither
  # is claimed — docs/VERIFYING.md states the boundary rather than leaving a
  # reader to assume it is wider than this.
  #
  # `fail-fast: false` so a difference is attributed rather than merely
  # detected: which leg diverged is most of the diagnosis.
  reproducible-elsewhere:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: node22
            node: 22
            dir: keymaker
          - id: node22-longer-checkout-path
            node: 22
            dir: a-checkout-directory-named-nothing-like-the-other-one
          - id: node24
            node: 24
            dir: keymaker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ matrix.dir }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.dir }}

      # The deploy layout, because that is the artifact whose manifest gets
      # signed and published. The build id is pinned to the commit for the same
      # reason verify-reproducible.mjs pins it: a PR checkout is a merge commit
      # that does not exist upstream, and letting each leg resolve it from git
      # would be comparing git rather than the build.
      - name: Build
        run: npm run build
        working-directory: ${{ matrix.dir }}
        env:
          KEYMAKER_BASE_PATH: /Keymaker-v2
          KEYMAKER_BUILD_ID: ${{ github.sha }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sums-${{ matrix.id }}
          path: ${{ matrix.dir }}/out/SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  reproducible-elsewhere-compare:
    needs: reproducible-elsewhere
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sums-*
          path: sums

      # SHA256SUMS covers every file in the export, so comparing the manifests
      # compares the whole artifact — and a difference names the file rather
      # than just asserting one exists.
      - name: Every runner produced the same manifest
        run: |
          set -u
          shopt -s nullglob
          manifests=(sums/*/SHA256SUMS)
          if [ "${#manifests[@]}" -lt 2 ]; then
            echo "::error::expected at least 2 manifests to compare, found ${#manifests[@]}."
            echo "A comparison of one manifest against nothing would pass while proving nothing."
            exit 1
          fi
          reference="${manifests[0]}"
          echo "comparing ${#manifests[@]} manifests against $reference"
          status=0
          for manifest in "${manifests[@]:1}"; do
            if diff -u "$reference" "$manifest"; then
              echo "  ok: $manifest"
            else
              echo "::error::$manifest differs from $reference — the same commit built to different bytes on a different runner, so the published artifact cannot be reproduced by rebuilding it."
              status=1
            fi
          done
          exit $status
