name: CI

# Build + typecheck + the KEYM v1 regression suite.
#
# This is deliberately separate from crypto-regression.yml. That workflow
# gates the frozen IBTZ core and runs with no `npm ci` at all, so no
# untrusted install script can ever execute in the job that guards
# decryption of users' existing files. This one needs the dependency tree
# (hash-wasm, @noble/ciphers, esbuild, next), so it is kept apart.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  # A zero-egress tool should not phone home from its own build either.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave GITHUB_TOKEN in .git/config where a dependency
          # install script could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The denominator of the passphrase generator's entropy claim. A dropped
      # or duplicated entry would make every bit count the UI prints an
      # overstatement, and nothing else in the suite would notice.
      - name: EFF wordlist integrity
        run: npm run test:wordlist

      - name: KEYM v1 regression suite
        run: npm run test:keymaker

      - name: KEYM version dispatch
        run: npm run test:keym2-dispatch

      # parseKeym() consumes fully attacker-controlled binary before any of it
      # has been authenticated. Seeded and deterministic, so a CI failure
      # reproduces exactly.
      - name: Parser fuzzing
        run: npm run test:fuzz

      - name: Production build (static export + CSP hashes)
        run: npm run build

  # Two clean builds of the same commit must produce identical bytes.
  #
  # This is what makes the signed manifest mean something a user can act on.
  # A signature alone proves "CI built this"; reproducibility is what lets
  # someone check that what CI built matches the source they read. It is also
  # unusually easy to lose by accident — one timestamp or random id baked into
  # a bundle and it is gone, with nothing else failing.
  #
  # Its own job because it runs the full build twice, and there is no reason
  # for that to serialise behind the test suite.
  reproducible:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build twice and compare every byte
        run: npm run verify:reproducible
        env:
          KEYMAKER_BASE_PATH: /Keymaker-v2
