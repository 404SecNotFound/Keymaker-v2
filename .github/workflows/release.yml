name: Release

# Publishes a tagged release: the built site, its manifest, and the Sigstore
# signature over that manifest.
#
# Roadmap 6.2. The point is not that a tarball exists — it is that `SHA256SUMS`
# and `SHA256SUMS.sigstore` become *reachable*. Until there was a release, the
# only copy of either lived at the root of the deployed site, which meant the
# verification story in docs/VERIFYING.md had nothing a stranger could download
# and check against.
#
# The artifact is built with the Pages base path on purpose, so it is
# byte-comparable to the deployment. Its job is making the live site checkable,
# not being a portable build.
#
# Cutting a release is `git tag -a v2.0.0 && git push origin v2.0.0`. Use an
# *annotated* tag: its message becomes the "What changed" section, and the
# person cutting the release is the right author for that. The version in the
# tag must match package.json — scripts/release-notes.mjs refuses otherwise,
# which is the cheap place to catch it, since a published release is immutable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# No workflow-level permissions. Each job takes only what it needs, so the job
# running untrusted transitive install scripts via `npm ci` never holds a token
# that can mint an OIDC identity or write to the repository. Same reasoning as
# deploy.yml, and it matters more here: this workflow's identity is what the
# published verification command names.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't persist the GITHUB_TOKEN in .git/config where dependency
          # install scripts could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Fail in the first thirty seconds rather than after a four-minute build
      # and a Sigstore signature. This runs the same generator `publish` uses,
      # so there is no second copy of the rule to drift: it rejects a ref that
      # is not `v<package.json version>`, and it proves the notes compose at all
      # before anything gets signed.
      - name: The release notes must compose for this ref
        run: |
          node scripts/release-notes.mjs '${{ github.ref_name }}' \
            '${{ github.server_url }}/${{ github.workflow_ref }}' > /dev/null

      # The tag must be annotated, and this is the cheap place to find out.
      #
      # A lightweight tag is a ref pointing straight at a commit: no message,
      # no tagger, no date of its own. The publish job already declines to
      # invent a changelog from one — %(contents:subject) falls through to the
      # commit subject, so a release would have announced "Merge pull request
      # #29" as its notes — but declining quietly meant v2.0.0 shipped
      # lightweight and nobody found out until a review said so.
      #
      # Asked over the API rather than by fetching tags, so the build job keeps
      # its shallow checkout. `object.type` is "tag" for an annotated tag and
      # "commit" for a lightweight one.
      - name: The tag must be annotated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          KIND=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.type')
          if [ "$KIND" != tag ]; then
            echo "::error::$TAG is a lightweight tag. A release's changelog is its tag message, and a lightweight tag has none."
            echo "Re-cut it with a message:  git tag -a -f $TAG -m '...' && git push --force origin $TAG"
            exit 1
          fi
          echo "$TAG is annotated."

      - run: npm ci

      # The same base path deploy.yml uses. A root build would produce a
      # different manifest, and then the release could not be compared against
      # the live site — which is the one thing it is for.
      # KEYMAKER_RELEASE_TAG is what tells next.config.js this artifact is the
      # tagged release rather than a rolling build of main. Nothing else sets
      # it, so deploy.yml, CI and local builds are all labelled development —
      # which is what they are.
      - run: npm run build
        env:
          KEYMAKER_BASE_PATH: /Keymaker-v2
          KEYMAKER_RELEASE_TAG: ${{ github.ref_name }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: out
          retention-days: 1
          include-hidden-files: true

  # Signing and packaging happen here, in the job that holds `id-token: write`
  # but has run no install scripts. Packaging is here rather than in publish so
  # that the job holding `contents: write` installs nothing at all.
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # No lifecycle scripts: this job holds the token, so nothing it installs
      # is allowed to run code.
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: out

      - name: Sign the build manifest
        run: node scripts/sign-manifest.mjs

      # Check the signature from the bundle alone before anything is published.
      # The identity is this workflow on this tag, not deploy.yml on main —
      # a release verified against the deployment's identity would pass here
      # and fail for every user, which is the failure worth catching now.
      - name: Verify the signature before packaging
        run: node scripts/verify-manifest.mjs
        env:
          KEYMAKER_CERT_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}

      # Deterministic flags so two runs of the same tag produce the same
      # tarball. Not load-bearing for verification — SHA256SUMS covers the
      # contents, and it travels inside — but a release artifact that changes
      # bytes on a re-run invites a question nobody should have to answer.
      - name: Package
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          cp -r out "keymaker-$TAG"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='UTC 1970-01-01' \
              -cf - "keymaker-$TAG" | gzip -n -9 > "keymaker-$TAG.tar.gz"

      # Run the first command the release notes will print, against the archive
      # a user will actually download. `sha256sum` is not this project's code,
      # which is the property that makes the check worth anything.
      - name: Verify the packaged archive the way the notes tell users to
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          mkdir -p /tmp/unpack && cd /tmp/unpack
          tar -xzf "$GITHUB_WORKSPACE/keymaker-$TAG.tar.gz"
          cd "keymaker-$TAG"
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            keymaker-${{ github.ref_name }}.tar.gz
            out/SHA256SUMS
            out/SHA256SUMS.sigstore
          retention-days: 1

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag message is the "What changed" section, and it only exists
          # in the object, not the ref — so fetch tags rather than just the
          # commit. Still no persisted credentials.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Deliberately no `npm ci`. scripts/release-notes.mjs reads two files and
      # writes text; it has no dependencies. This job can write to the
      # repository, so it installs nothing.

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets

      - name: Compose the release notes
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          # An annotated tag's message is the changelog.
          #
          # The objecttype guard is not paranoia: for a *lightweight* tag,
          # %(contents:subject) silently falls through to the commit it points
          # at, so without this a release would announce "Merge pull request
          # #29" as its changelog. Better to omit the section than to fake it.
          #
          # subject+body rather than %(contents): the latter includes the PGP
          # block on a signed tag, and pasting an armoured signature into the
          # release body would be a strange thing to do to a reader.
          : > /tmp/changelog.txt
          if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || true)" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" \
              > /tmp/changelog.txt
          fi
          node scripts/release-notes.mjs "$TAG" \
            '${{ github.server_url }}/${{ github.workflow_ref }}' \
            /tmp/changelog.txt > /tmp/NOTES.md
          cat /tmp/NOTES.md

      # `gh` is preinstalled on GitHub-hosted runners, so this needs no
      # third-party action. Every action in this repository is pinned to a
      # commit SHA; adding an unpinned one to a workflow whose entire output is
      # a supply-chain claim would be a poor trade.
      #
      # Re-runnable on purpose: if publishing failed after the release object
      # was created, a re-run must converge rather than error.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          ASSETS=(
            "assets/keymaker-$TAG.tar.gz"
            "assets/out/SHA256SUMS"
            "assets/out/SHA256SUMS.sigstore"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release object already exists. Two cases look identical from
            # here and must not be treated the same: a previous run that died
            # between `create` and the last upload, and someone re-pointing a
            # published release at different bytes.
            #
            # This used to be `--clobber`, which silently did both. A published
            # release is what the verification story rests on — the whole point
            # of SHA256SUMS.sigstore is that the bytes cannot change after the
            # fact — so an asset that already exists is only allowed through if
            # it is byte-identical to what we are holding.
            for path in "${ASSETS[@]}"; do
              name=$(basename "$path")
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$name"; then
                gh release download "$TAG" --pattern "$name" --dir /tmp/published --clobber
                if ! cmp -s "$path" "/tmp/published/$name"; then
                  echo "::error::$name is already published on $TAG with different bytes."
                  echo "A published release is immutable by design. Cut a new version rather than replacing this one."
                  exit 1
                fi
                echo "$name already published, identical — leaving it alone."
              else
                gh release upload "$TAG" "$path"
              fi
            done
            gh release edit "$TAG" --notes-file /tmp/NOTES.md
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "Keymaker $TAG" \
              --notes-file /tmp/NOTES.md \
              "${ASSETS[@]}"
          fi
