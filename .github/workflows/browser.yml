name: Browser tests

# Exercises the production static export in real browsers.
#
# This exists because of a specific failure: the shipped bundle's CSP omitted
# 'wasm-unsafe-eval', so hash-wasm could not compile its module and Argon2id —
# the headline feature — silently did nothing. Both existing safety nets were
# structurally blind to it. The CSP meta tag is only emitted for production, so
# `npm run dev` worked; and the Node suite runs under no CSP at all, so all 70
# Argon2id vectors passed while the artifact users download could not derive a
# single key.
#
# No amount of additional Node testing closes that gap. Only a browser loading
# the built output does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build the production export
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
