name: Browser tests

# Exercises the production static export in real browsers.
#
# This exists because of a specific failure: the shipped bundle's CSP omitted
# 'wasm-unsafe-eval', so hash-wasm could not compile its module and Argon2id —
# the headline feature — silently did nothing. Both existing safety nets were
# structurally blind to it. The CSP meta tag is only emitted for production, so
# `npm run dev` worked; and the Node suite runs under no CSP at all, so all 70
# Argon2id vectors passed while the artifact users download could not derive a
# single key.
#
# No amount of additional Node testing closes that gap. Only a browser loading
# the built output does.

# No `push` on main: deploy.yml calls this via `workflow_call` before it
# publishes (R01), so main is verified once as a deploy prerequisite rather
# than a second time on push. PRs still run it directly.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # One runner per engine. The suite is CPU-bound (playwright.config.ts caps
  # workers at 2 for that reason), and running all three engines in one job
  # on a 2-vCPU runner meant webkit and firefox shared a CPU with each other
  # and with Argon2id. Of the last 100 runs, 10 failed on a timeout in a test
  # that passed on the next attempt, four of them on main with no change in
  # between, and every one on firefox or webkit. Three runners give each
  # engine the machine to itself and cut wall time from about 19 minutes to
  # the slowest single engine.
  engine:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      # Built and served under the same base path as production.
      #
      # deploy.yml ships with KEYMAKER_BASE_PATH=/Keymaker-v2, so every asset
      # in the deployed HTML is referenced absolutely as `/Keymaker-v2/...`.
      # This job used to build and serve at the origin root, which meant the
      # whole suite could be green against a layout no user has ever received
      # — the same blind spot, one level up, as the dev-server gap this
      # workflow was created for.
      #
      # The local default stays root-relative so `npm run build && npm run
      # test:browser` needs no environment; CI is where the shipped layout
      # gets exercised.
      # The value comes out of deploy.yml, never a literal repeated here. A
      # copied literal is a gate that keeps testing /Keymaker-v2 after the
      # deployment has moved: still green, no longer about the artifact.
      - name: Take the base path from deploy.yml
        run: |
          echo "KEYMAKER_BASE_PATH=$(node -p "require('./scripts/deploy-base-path.cjs').deployBasePath()")" >> "$GITHUB_ENV"

      - name: Build the production export
        run: npm run build

      # `--project` selects this runner's engine from the three the config
      # defines under CI; the config still refuses to run with a missing
      # binary, so a broken install step fails loudly rather than skipping.
      - name: Run browser tests on ${{ matrix.engine }}
        run: npx playwright test --project=${{ matrix.engine }}

      # Only runs when the job has already failed, so a missing report is not a
      # cost worth absorbing quietly: `error` turns "nothing to upload" into a
      # red step instead of a warning nobody reads. That warning is exactly how
      # this went unnoticed — the CI reporters wrote no HTML report, so every
      # failing run threw away the traces that would have explained it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error

  # The one status the branch protection and deploy.yml wait on. Its name is
  # the required check, so it stays `browser` while the work moves into the
  # matrix above. `always()` so a red engine produces a red `browser` rather
  # than a skipped one, which branch protection would otherwise wait on
  # forever.
  browser:
    needs: engine
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every engine passed
        run: |
          echo "engine matrix result: ${{ needs.engine.result }}"
          test "${{ needs.engine.result }}" = "success"
