name: Browser tests

# Exercises the production static export in real browsers.
#
# This exists because of a specific failure: the shipped bundle's CSP omitted
# 'wasm-unsafe-eval', so hash-wasm could not compile its module and Argon2id —
# the headline feature — silently did nothing. Both existing safety nets were
# structurally blind to it. The CSP meta tag is only emitted for production, so
# `npm run dev` worked; and the Node suite runs under no CSP at all, so all 70
# Argon2id vectors passed while the artifact users download could not derive a
# single key.
#
# No amount of additional Node testing closes that gap. Only a browser loading
# the built output does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Built and served under the same base path as production.
      #
      # deploy.yml ships with KEYMAKER_BASE_PATH=/Keymaker-v2, so every asset
      # in the deployed HTML is referenced absolutely as `/Keymaker-v2/...`.
      # This job used to build and serve at the origin root, which meant the
      # whole suite could be green against a layout no user has ever received
      # — the same blind spot, one level up, as the dev-server gap this
      # workflow was created for.
      #
      # The local default stays root-relative so `npm run build && npm run
      # test:browser` needs no environment; CI is where the shipped layout
      # gets exercised.
      # The value comes out of deploy.yml, never a literal repeated here. A
      # copied literal is a gate that keeps testing /Keymaker-v2 after the
      # deployment has moved: still green, no longer about the artifact.
      - name: Take the base path from deploy.yml
        run: |
          echo "KEYMAKER_BASE_PATH=$(node -p "require('./scripts/deploy-base-path.cjs').deployBasePath()")" >> "$GITHUB_ENV"

      - name: Build the production export
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser

      # Only runs when the job has already failed, so a missing report is not a
      # cost worth absorbing quietly: `error` turns "nothing to upload" into a
      # red step instead of a warning nobody reads. That warning is exactly how
      # this went unnoticed — the CI reporters wrote no HTML report, so every
      # failing run threw away the traces that would have explained it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error
