name: Format conformance

# Cross-tests the TypeScript implementation against an independent Python
# reference written only from docs/FORMAT.md.
#
# The frozen fixtures prove Keymaker stays compatible with itself. They cannot
# prove it matches its own specification, because the implementation that
# generated them is the implementation that reads them back — a misreading of
# the spec would be encoded identically in both and would look like agreement.
#
# This job is the only thing in CI that tests the *document*. It has already
# caught one specification defect: FORMAT.md described the KDF cost parameters
# without bounding them, so an implementation written faithfully from the prose
# reproduced a resource-exhaustion flaw the TypeScript had already fixed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Install reference dependencies
        run: pip install -r reference/requirements.txt

      - name: Reference self-test (KEYM v1)
        run: python3 reference/keym.py selftest

      # KEYM v2 has no TypeScript yet, so there is nothing to cross-test
      # against — which is the point. The reference is written from
      # docs/FORMAT-V2-DESIGN.md *first*, so the specification is what gets
      # debugged, before an implementation exists to enshrine its gaps. It has
      # already found four (see §11 of that document, and §A of keym2.py).
      #
      # Running it in CI from now keeps those findings from rotting as the
      # proposal is edited.
      - name: Reference self-test (KEYM v2, spec-first)
        run: npm run test:keym2

      # Byte equality, not just round-trips. For v1 a bidirectional round-trip
      # is sufficient; for v2 it is not, and the reference proved why before
      # either implementation existed. §5.1 originally admitted two chunkings
      # for a plaintext that is an exact multiple of the chunk size, and both
      # decode correctly — so two writers could disagree, round-trip perfectly
      # in both directions, and still produce incompatible files.
      - name: Bidirectional conformance (KEYM v2, byte-for-byte)
        run: npm run test:conformance2

      - name: Bidirectional conformance
        run: npm run test:conformance

      # docs/RECOVERY.md tells someone holding a years-old backup that this
      # script and two libraries will get their data back. That promise has to
      # be executable, or it decays silently into a page of stale instructions.
      - name: Recovery procedure works as documented
        run: npm run test:recovery
